<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物專題首頁</title>
    <style>
        /* --- 基礎設定：全螢幕消除所有外距 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '微軟正黑體', 'Segoe UI', Arial, sans-serif;
        }

        html, body {
            width: 100%;
            background-color: #ffffff;
            overflow-x: hidden; /* 防止橫向滾動條 */
        }

        /* --- 滿版內容區塊 (從最頂端 0px 開始) --- */
        .main-container {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        /* 滿版 Canva 容器 (無縫貼合頂部) */
        .canva-full-embed {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 231.8448%; /* 精準維持你的 Canva 頁面長度比例 */
            overflow: hidden;
        }

        .canva-full-embed iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- 滿版首頁主體 (從最上方直接顯示 Canva 自帶的導覽列與首頁) -->
    <main class="main-container">
        <div class="canva-full-embed">
            <iframe loading="lazy" 
                src="https://www.canva.com/design/DAHVoMCYBw4/rDB0qQC2BGQiIaa003WeXA/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen">
            </iframe>
        </div>
    </main>

</body>
</html>
