<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物專題首頁</title>
    <style>
        /* --- 基礎設定 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '微軟正黑體', 'Segoe UI', Arial, sans-serif;
        }

        /* --- 背景圖片設定 --- */
        body {
            /* 這裡我先用一張免費的植物圖片當範例，你可以把 url() 裡面的網址換成你自己背景圖的相對路徑或網址 */
            background-image: url('https://images.unsplash.com/photo-1622383563227-04401ab4e5ea?q=80&w=2000&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh; /* 滿版高度 */
        }

        /* --- 頂部導覽列 (綠色橫幅) --- */
        .navbar {
            background-color: #8BC34A; /* 根據你的圖片配的淺綠色 */
            width: 100%;
            padding: 15px 0; /* 上下留白 */
            position: fixed; /* 固定在最上方 */
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .nav-links {
            display: flex;
            justify-content: center; /* 讓選項置中排列 */
            gap: 60px; /* 選項之間的間距，可自行調整 */
            list-style: none;
        }

        /* --- 標題字與互動效果 --- */
        .nav-links li a {
            color: white;
            text-decoration: none; /* 移除預設底線 */
            font-size: 18px;
            font-weight: bold;
            padding: 5px 10px;
            transition: all 0.3s ease; /* 平滑的漸變動畫 */
        }

        /* 游標滑過去時的互動效果 (Hover) */
        .nav-links li a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8); /* 微微發光效果 */
            transform: scale(1.05); /* 文字稍微變大 */
        }

        /* --- 畫面中央的主標題與副標題 --- */
        .hero-section {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* 絕對置中 */
            text-align: center;
            width: 100%;
        }

        .main-title {
            color: white;
            font-size: 64px; /* 大標題字體大小 */
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8); /* 黑色陰影，避免背景圖太亮看不清文字 */
        }

        .sub-title {
            color: white;
            font-size: 32px; /* 副標題字體大小 */
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <nav class="navbar">
        <ul class="nav-links">
            <!-- href="" 裡面放入你要跳轉的網址。 target="_blank" 代表在新分頁開啟 -->
            <li><a href="https://1132026-prog.github.io/green/" target="_blank">新增少量內文文字</a></li>
            <li><a href="https://example.com/link2" target="_blank">照片上傳</a></li>
            <li><a href="https://example.com/link3" target="_blank">操作說明</a></li>
            <li><a href="https://1132026-prog.github.io/green/services.html">服務項目</a></li>
            <li><a href="https://1132026-prog.github.io/green/about.html" target="_blank">關於我們</a></li>
        </ul>
    </nav>

    <!-- 畫面中央文字 -->
    <main class="hero-section">
        <h1 class="main-title">讓每一葉綠意，都成為抵禦氣候天災的堅韌防線</h1>
        <h2 class="sub-title">面對極端氣候帶來的農損危機，我們結合AI與元素分析儀，精準量化作物生長固碳量。推動建立「草本碳權農業保險」機制，將植物的生態價值轉化為在地農民的防災補償，實現環保與農業的實質雙贏。</h2>
    </main>

</body>
</html>
