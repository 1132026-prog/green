<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拍照上傳系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 讓 Canva 區域自動填滿導覽列下方所有空間 */
        .canva-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 64px);
            overflow: hidden;
        }
        .canva-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <!-- 頂部導覽列 (選單名稱已同步為您的植物綠色主題) -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-50 h-16">
        <div class="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
            <div class="text-xl font-bold text-green-600 flex items-center gap-2">🌱 綠色農作分析系統</div>
            <nav class="hidden md:flex space-x-6 text-slate-600 font-medium">
                <a href="index.html" class="text-green-600 font-bold border-b-2 border-green-600 pb-1">照片上傳</a>
                <a href="about.html" class="hover:text-green-600 transition">操作說明</a>
                <a href="services.html" class="hover:text-green-600 transition">歷史報告</a>
                <a href="contact.html" class="hover:text-green-600 transition">關於我們</a>
            </nav>
        </div>
    </header>

    <!-- 主內容區：滿版顯示 Canva 專案 -->
    <main class="flex-grow w-full">
        <div class="canva-container">
            <iframe 
                loading="lazy" 
                src="https://www.canva.com/design/DAHTugD_qPc/GNO5sTLrbRItQoue2pLoIA/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen">
            </iframe>
        </div>
    </main>
</body>
</html>
