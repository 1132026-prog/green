<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物專題首頁</title>
    <style>
        /* --- 基礎設定 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '微軟正黑體', 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            overflow-x: hidden;
        }

        /* --- 頂部導覽列 (綠色橫幅固定在上) --- */
        .navbar {
            background-color: #8BC34A; /* 淺綠色 */
            width: 100%;
            padding: 15px 0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 60px;
            list-style: none;
        }

        .nav-links li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 5px 10px;
            transition: all 0.3s ease;
        }

        .nav-links li a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        /* --- 主內容區塊 (放置 Canva 設計) --- */
        .main-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 40px 20px; /* 上方預留 80px 避開選單遮擋 */
        }

        .canva-embed-wrapper {
            width: 100%;
            max-width: 1100px; /* 控制 Canva 頁面最大寬度，呈現最佳視覺比例 */
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="https://1132026-prog.github.io/green/" target="_blank">新增少量內文文字</a></li>
            <li><a href="https://example.com/link2" target="_blank">照片上傳</a></li>
            <li><a href="https://example.com/link3" target="_blank">操作說明</a></li>
            <li><a href="https://1132026-prog.github.io/green/services.html">服務項目</a></li>
            <li><a href="https://1132026-prog.github.io/green/about.html" target="_blank">關於我們</a></li>
        </ul>
    </nav>

    <!-- 主體內容：嵌入新版長頁面 Canva 設計 -->
    <main class="main-container">
        <div class="canva-embed-wrapper">
            <div style="position: relative; width: 100%; height: 0; padding-top: 231.8448%; padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden; border-radius: 8px; will-change: transform;">
              <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
                src="https://www.canva.com/design/DAHVoMCYBw4/rDB0qQC2BGQiIaa003WeXA/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
              </iframe>
            </div>
            1143006 設計的 <a href="https://www.canva.com/design/DAHVoMCYBw4/rDB0qQC2BGQiIaa003WeXA/view?utm_content=DAHVoMCYBw4&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">Freelance Portfolio Website in Lime Green Blue Black Bold Dynamic Style</a>
        </div>
    </main>

</body>
</html>
