<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的網站 - 聯絡我們</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <header class="bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="text-xl font-bold text-indigo-600">🚀 多頁網站專案</div>
            <nav class="hidden md:flex space-x-6 text-slate-600 font-medium">
                <a href="index.html" class="hover:text-indigo-600 transition">首頁</a>
                <a href="about.html" class="hover:text-indigo-600 transition">關於我們</a>
                <a href="services.html" class="hover:text-indigo-600 transition">服務項目</a>
                <a href="portfolio.html" class="hover:text-indigo-600 transition">作品集</a>
                <a href="contact.html" class="text-indigo-600 font-bold border-b-2 border-indigo-600 pb-1">聯絡我們</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-16 w-full">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-4">與我們取得聯繫</h1>
            <p class="text-lg text-slate-600">歡迎填寫表單，我們將儘速與您聯繫。</p>
        </div>
        <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
            <form onsubmit="event.preventDefault(); alert('表單已送出！');" class="space-y-4">
                <input type="text" placeholder="您的姓名" required class="w-full p-3 border rounded-lg">
                <input type="email" placeholder="電子郵件" required class="w-full p-3 border rounded-lg">
                <textarea placeholder="諮詢訊息" rows="4" required class="w-full p-3 border rounded-lg"></textarea>
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">送出訊息</button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 text-center">
        <p>© 2026 My Multi-Page Website. All rights reserved.</p>
    </footer>
</body>
</html>
